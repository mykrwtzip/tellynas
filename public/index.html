<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tellynas — Telegram Cloud</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
      <div class="login-card">
        <div class="login-icon">
          <i data-lucide="cloud" size="48"></i>
        </div>
        <h1>Tellynas</h1>
        <p>Your files, stored on Telegram</p>
        <form id="loginForm">
          <div class="input-group">
            <i data-lucide="user" size="18"></i>
            <input type="text" id="username" placeholder="Username" required>
          </div>
          <div class="input-group">
            <i data-lucide="lock" size="18"></i>
            <input type="password" id="password" placeholder="Password" required>
          </div>
          <button type="submit" class="btn-primary">
            <i data-lucide="log-in" size="18"></i>
            Login
          </button>
          <div id="loginError" class="error"></div>
        </form>
      </div>
    </div>

    <!-- Main App -->
    <div id="mainScreen" class="screen">
      <header>
        <div class="header-left">
          <i data-lucide="cloud" size="24"></i>
          <span class="logo">Tellynas</span>
        </div>
        <div class="header-right">
          <button id="logoutBtn" class="btn-icon">
            <i data-lucide="log-out" size="18"></i>
          </button>
        </div>
      </header>

      <div class="toolbar">
        <button id="uploadBtn" class="btn-primary">
          <i data-lucide="upload" size="18"></i>
          Upload
        </button>
        <button id="newFolderBtn" class="btn-secondary">
          <i data-lucide="folder-plus" size="18"></i>
          New Folder
        </button>
        <input type="file" id="fileInput" multiple hidden>
      </div>

      <div id="fileList" class="file-list">
        <div class="empty-state">
          <i data-lucide="inbox" size="48"></i>
          <p>No files yet. Upload your first file!</p>
        </div>
      </div>

      <!-- Upload progress -->
      <div id="uploadProgress" class="upload-progress hidden">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span id="progressText">Uploading...</span>
      </div>
    </div>
  </div>
  <script src="/js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
